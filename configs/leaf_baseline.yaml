# Baseline: binary healthy vs affected on the combined public leaf datasets.
#
# This is a pipeline validation run, not a product model. The data is close-range
# leaf photography of mostly non-Spanish diseases, at 80% affected prevalence
# against 2-5% in a real grove. Good numbers here mean the machinery works, not
# that the problem is solved.
name: leaf_baseline
device: auto

data:
  image_size: 224
  batch_size: 32
  seed: 42
  binary: true
  balance_classes: true

model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.3

optim:
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 1
  label_smoothing: 0.05
  grad_clip: 1.0
  amp: true
  early_stopping_patience: 5

# Real grove prevalence, used to project PPV from the test set.
field_prevalence: 0.02
