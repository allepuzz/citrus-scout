[project]
name = "citrus-scout"
version = "0.1.0"
description = "Deteccion de plagas y enfermedades en citricos mediante imagen aerea (UAV) y vision por computador"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Angel Allepuz", email = "allepuzangel@gmail.com" }]

dependencies = [
    # Deep learning
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "timm>=1.0.0",           # backbones preentrenados (EfficientNet, ConvNeXt...)
    # Datos e imagen
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "albumentations>=1.4.0", # augmentacion
    # Metricas y evaluacion
    "scikit-learn>=1.5.0",
    "torchmetrics>=1.4.0",
    # Configuracion y CLI
    "pyyaml>=6.0",
    "pydantic>=2.9.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "tqdm>=4.66.0",
    # Tracking de experimentos
    "wandb>=0.18.0",
    # Descarga de datasets
    "kaggle>=1.6.0",
    # Visualizacion
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
citrus-scout = "citrus_scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citrus_scout"]

# ---------------------------------------------------------------------------
# Ruff: linter + formateador
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # argumentos sin usar
    "SIM", # flake8-simplify
    "PTH", # usar pathlib
    "RUF", # reglas propias de ruff
]
ignore = [
    "E501",  # longitud de linea (la gestiona el formateador)
    "B008",  # llamadas en argumentos por defecto (typer lo usa)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
"notebooks/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "slow: tests lentos (deselecciona con -m 'not slow')",
    "gpu: requiere GPU",
]

# ---------------------------------------------------------------------------
# PyTorch con CUDA: indice extra para las ruedas de cu124
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
